<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindPal - Login</title>
    <style>
        /* Login Page */
.login-container {
    width: 40%;
    margin: 50px auto;
    text-align: center;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
}

.login-container h2 {
    font-size: 24px;
    margin-bottom: 10px;
}

.login-container p {
    font-size: 14px;
    color: gray;
}

.input-group {
    margin: 15px 0;
}

.input-group input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    background: #635BFF;
    color: white;
    font-size: 18px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #554AE3;
}

.login-container a {
    color: #635BFF;
    text-decoration: none;
    font-weight: bold;
}

/* Header */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 10%;
    background: white;
}

.logo {
    display: flex;
    align-items: center;
    font-size: 20px;
    font-weight: bold;
}

.logo img {
    width: 30px;
    margin-right: 10px;
}

nav ul {
    display: flex;
    list-style: none;
}

nav ul li {
    margin: 0 15px;
}

nav ul li a {
    text-decoration: none;
    font-size: 16px;
    color: black;
}

.header-buttons {
    display: flex;
}

.header-buttons button {
    background: white;
    border: 1px solid #635BFF;
    padding: 8px 12px;
    margin-left: 10px;
    cursor: pointer;
    border-radius: 5px;
}

.header-buttons button:hover {
    background: #635BFF;
    color: white;
}

    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="logo.png" alt="MindPal Logo">
            <span>MindPal</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Community</a></li>
                <li><a href="#">Resources</a></li>
            </ul>
        </nav>
        <div class="header-buttons">
            <button class="help-btn">❔ Help</button>
            <button class="profile-btn">👤 Profile</button>
        </div>
    </header>

    <!-- Login Form -->
    <main class="login-container">
        <h2>Login</h2>
        <p>Enter your username and password to log in to your account</p>
        <form action="#" method="post">
            <div class="input-group">
                <input type="text" placeholder="👤 Username" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="🔒 Password" required>
            </div>
            <button type="submit">🔓 Log In</button>
        </form>
        <p><a href="#">Forgot your password?</a></p>
    </main>

</body>
</html>
