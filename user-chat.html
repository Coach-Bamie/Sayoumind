<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindPal Chat</title>
    <style>
        /* Chat Page */
.chat-container {
    width: 80%;
    margin: 40px auto;
    text-align: center;
}

/* Back Button */
.back-button a {
    font-size: 30px;
    text-decoration: none;
    color: black;
}

/* Department Selection */
h2 {
    font-size: 22px;
    margin-bottom: 15px;
}

.department-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}

.dept-btn {
    padding: 10px 15px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background: white;
    cursor: pointer;
    transition: 0.3s ease-in-out;
}

.dept-btn:hover {
    background: #ddd;
}

/* Chat Box */
.chat-box {
    width: 60%;
    margin: 20px auto;
    padding: 15px;
    border-radius: 8px;
    background: #f7f7f7;
    text-align: left;
}

.chat-message {
    background: white;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.1);
    margin-bottom: 10px;
}

.timestamp {
    display: block;
    font-size: 12px;
    color: gray;
    margin-top: 5px;
}

/* Typing Status */
.typing-status {
    font-style: italic;
    color: gray;
    margin-bottom: 10px;
}

/* Chat Input */
.chat-input {
    display: flex;
    gap: 5px;
    margin-top: 15px;
}

.chat-input input {
    flex: 1;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

.send-btn {
    padding: 10px 15px;
    background: #646cff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="logo.png" alt="MindPal Logo">
            <span>MindPal</span>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Community</a></li>
                <li><a href="#">Resources</a></li>
            </ul>
        </nav>
        <div class="profile">
            <img src="user-avatar.png" alt="User Profile">
        </div>
    </header>

    <!-- Chat Section -->
    <main class="chat-container">
        <div class="back-button">
            <a href="dashboard.html">←</a>
        </div>

        <h2>Select Your Department</h2>
        <div class="department-buttons">
            <button class="dept-btn">Guidance & Counseling</button>
            <button class="dept-btn">Security</button>
            <button class="dept-btn">Clinical</button>
        </div>

        <!-- Chat Box -->
        <div class="chat-box">
            <div class="chat-message">
                <p>
                    Thank you for the information. I’m ready to start the coaching. 
                    I want to focus on developing my emotional intelligence. How can we plan our sessions around that topic?
                </p>
                <span class="timestamp">09:02 AM</span>
            </div>

            <p class="typing-status">✎ Counselor is typing...</p>

            <div class="chat-input">
                <input type="text" placeholder="Type a new message">
                <button class="send-btn">Send</button>
            </div>
        </div>
    </main>

</body>
</html>
