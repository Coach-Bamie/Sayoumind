<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindPal - Sign Up</title>
   <style>

    /* Header */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 15px 10%;
    border-bottom: 1px solid #ddd;
}

.logo {
    display: flex;
    align-items: center;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

.logo img {
    width: 40px;
    margin-right: 10px;
}

nav ul {
    list-style: none;
    display: flex;
    padding: 0;
}

nav ul li {
    margin: 0 15px;
}

nav ul li a {
    text-decoration: none;
    color: #333;
    font-size: 18px;
}

    /* Sign-Up Page */
.signup-container {
    width: 40%;
    margin: 50px auto;
    text-align: center;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
}

.signup-container h2 {
    font-size: 24px;
    margin-bottom: 10px;
}

.signup-container p {
    font-size: 14px;
    color: gray;
}

.input-group {
    margin: 15px 0;
}

.input-group input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    background: #635BFF;
    color: white;
    font-size: 18px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #554AE3;
}

.signup-container a {
    color: #635BFF;
    text-decoration: none;
    font-weight: bold;
}

   </style>
</head>
<body>

    
    <header>
        <div class="logo">
            <img src="images/mindpal logo.png" alt="MindPal Logo">
            <span>MindPal</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="community.html">Community</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Sign-Up Form -->
    <main class="signup-container">
        <h2>SIGN UP</h2>
        <p>Enter your details to create an account</p>
        <form action="#" method="post">
            <div class="input-group">
                <input type="email" placeholder="📧 Email" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="🔒 Password" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="🔒 Confirm Password" required>
            </div>
            <button type="submit">Sign up</button>
        </form>
        <p>Already have an account? <a href="login.html">Log in</a></p>
    </main>

</body>
</html>
