<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindPal - Hotlines</title>
    <style>
        /* Hotlines Page */
.hotlines-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    margin: 40px auto;
    width: 80%;
}

.hotline {
    width: 45%;
    background: white;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
}

.hotline img {
    width: 100%;
    height: 150px;
    border-radius: 5px;
    object-fit: cover;
}

.hotline h3 {
    margin: 10px 0;
    font-size: 18px;
}

.hotline p {
    color: gray;
    font-size: 14px;
}

.call-btn {
    background: transparent;
    border: 1px solid blue;
    color: blue;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s ease;
}

.call-btn:hover {
    background: blue;
    color: white;
}

    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="logo.png" alt="MindPal Logo">
            <span>MindPal</span>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Community</a></li>
                <li><a href="#">Resources</a></li>
            </ul>
        </nav>
        <div class="profile">
            <img src="user-avatar.png" alt="User Profile">
        </div>
    </header>

    <!-- Hotlines Section -->
    <main class="hotlines-container">
        <div class="hotline">
            <img src="fire-service.jpg" alt="Fire Service">
            <h3>FUD FIRE SERVICE</h3>
            <p>Available 24/7</p>
            <button class="call-btn">CALL NOW</button>
        </div>

        <div class="hotline">
            <img src="health-director.jpg" alt="Health Director">
            <h3>HEALTH DIRECTOR</h3>
            <p>Available 24/7</p>
            <button class="call-btn">CALL NOW</button>
        </div>

        <div class="hotline">
            <img src="security.jpg" alt="Security Supervisor">
            <h3>SECURITY PATROL SUPERVISOR</h3>
            <p>Available 24/7</p>
            <button class="call-btn">CALL NOW</button>
        </div>

        <div class="hotline">
            <img src="sug-president.jpg" alt="SUG President">
            <h3>SUG PRESIDENT</h3>
            <p>Available 24/7</p>
            <button class="call-btn">CALL NOW</button>
        </div>
    </main>

</body>
</html>
