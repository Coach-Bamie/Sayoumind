<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindPal - Contact Us</title>
    <style>
        /* Contact Us Page */
.contact-container {
    text-align: center;
    margin: 40px auto;
    width: 50%;
}

.contact-container h2 {
    font-size: 24px;
    margin-bottom: 10px;
}

.contact-container p {
    font-size: 14px;
    color: gray;
    margin-bottom: 20px;
}

.contact-box {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
}

.contact-box h3 {
    font-size: 20px;
    margin-bottom: 15px;
}

form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

form label {
    font-size: 14px;
    text-align: left;
}

form input, form textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid lightgray;
    border-radius: 5px;
    font-size: 14px;
}

textarea {
    height: 100px;
    resize: none;
}

.submit-btn {
    background: blue;
    color: white;
    border: none;
    padding: 10px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
}

.submit-btn:hover {
    background: darkblue;
}

    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="logo.png" alt="MindPal Logo">
            <span>MindPal</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Community</a></li>
                <li><a href="#">Resources</a></li>
            </ul>
        </nav>
        <button class="profile-btn">🔹 Profile</button>
    </header>

    <!-- Contact Us Section -->
    <main class="contact-container">
        <h2>Need Assistance?</h2>
        <p>Our support is always there for you. Reach out with your questions and we'll respond ASAP.</p>
        
        <div class="contact-box">
            <h3>Contact Us</h3>
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
                
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@email.com" required>
                
                <label for="message">Question</label>
                <textarea id="message" placeholder="Enter question or feedback" required></textarea>
                
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </main>

</body>
</html>
