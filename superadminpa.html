<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Reset styles */
body {
    font-family: Arial, sans-serif;
    background-color: #f9f9f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    flex-direction: column;
}

/* Container */
.container {
    width: 600px;
    text-align: center;
}

/* Title */
h2 {
    font-size: 24px;
    font-weight: bold;
}

.subtitle {
    font-style: italic;
    font-size: 14px;
    color: #666;
}

/* Admin Card */
.admin-card {
    background-color: #bfbfbf;
    padding: 20px;
    margin: 15px 0;
    border-radius: 8px;
    text-align: left;
}

.admin-card p {
    font-size: 16px;
    margin: 5px 0;
}

/* Remove Button */
.remove-btn {
    width: 100%;
    padding: 12px;
    background-color: #5A5AD1;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

/* Add New Admin Section */
.add-admin {
    background-color: #dcdcdc;
    padding: 20px;
    border-radius: 8px;
    margin-top: 20px;
}

.add-admin h3 {
    margin-bottom: 10px;
}

.add-admin input,
.add-admin select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
}

.add-btn {
    width: 100%;
    padding: 12px;
    background-color: #5A5AD1;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

    </style>
</head>
<body>
    <div class="container">
        <h2>Super Admin Panel</h2>
        <p class="subtitle">Manage department admins</p>

        <!-- Admin List -->
        <div class="admin-card">
            <p><strong>Name:</strong> Bamie</p>
            <p><strong>Department:</strong> Security</p>
            <button class="remove-btn">Remove Admin</button>
        </div>

        <div class="admin-card">
            <p><strong>Name:</strong> Adamu Yusuf</p>
            <p><strong>Department:</strong> Counseling</p>
            <button class="remove-btn">Remove Admin</button>
        </div>

        <div class="admin-card">
            <p><strong>Name:</strong> Adamu Ashiat</p>
            <p><strong>Department:</strong> Medical</p>
            <button class="remove-btn">Remove Admin</button>
        </div>

        <!-- Add New Admin Section -->
        <div class="add-admin">
            <h3>Add New Admin</h3>
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <select>
                <option>Select Department</option>
                <option>Security</option>
                <option>Counseling</option>
                <option>Medical</option>
            </select>
            <button class="add-btn">Add Admin</button>
        </div>
    </div>
</body>
</html>
