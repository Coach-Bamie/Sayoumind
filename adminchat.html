<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - MindPal</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 0;
    text-align: center;
}

/* Header */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 15px 10%;
    border-bottom: 1px solid #ddd;
}

.logo {
    display: flex;
    align-items: center;
    font-size: 22px;
    font-weight: bold;
}

.logo img {
    width: 40px;
    margin-right: 10px;
}

nav ul {
    list-style: none;
    display: flex;
    padding: 0;
}

nav ul li {
    margin: 0 15px;
}

nav ul li a {
    text-decoration: none;
    color: #333;
    font-size: 18px;
}

.container {
    width: 60%;
    margin: 50px auto;
}

h2 {
    font-size: 22px;
    font-weight: bold;
}

.subtitle {
    font-style: italic;
    color: #666;
    margin-bottom: 20px;
}

.chat-box {
    background: #e5e5e5;
    padding: 20px;
    border-radius: 10px;
    width: 100%;
    height: 50VH;
    margin: 0 auto;
}

.message {
    display: flex;
    align-items: center;
    margin: 10px 0;
}

.user {
    justify-content: flex-start;
}

.admin {
    justify-content: flex-end;
}

.message p {
    background: white;
    padding: 10px;
    border-radius: 5px;
    margin: 0 10px;
    max-width: 70%;
}

.icon {
    font-size: 20px;
}

.response-box {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.response-box input {
    width: 60%;
    height: 20px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.response-box button {
    background: #4f54fc;
    color: white;
    border: none;
    height: 40px;
    padding: 10px 15px;
    margin-left: 10px;
    border-radius: 5px;
    cursor: pointer;
}

.response-box button:hover {
    background: #3e42e0;
}

    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="images/mindpal logo.png" alt="MindPal Logo">
            <span>MindPal</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Community</a></li>
                <li><a href="#">Resources</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2>Admin Panel FUD MindPal</h2>
        <p class="subtitle">Veiw And Respond To Anonymous Messags Securly</p>

        <div class="chat-box">
            <div class="message user">
                <span class="icon">👤</span>
                <p>Good afternoon, please I feel unsafe,</p>
            </div>
            <div class="message admin">
                <p>Express your feelings, we’re here to guide you</p>
                <span class="icon">👤</span>
            </div>
        </div>

        <div class="response-box">
            <input type="text" placeholder="Type your response">
            <button>Send Response</button>
        </div>
    </div>
</body>
</html>
