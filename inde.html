<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindPal - Welcome</title>
    <style>
        /* General Styles */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
    background-color: #ffffff;
}

/* Header */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 15px 10%;
    border-bottom: 1px solid #ddd;
}

.logo {
    display: flex;
    align-items: center;
    font-size: 22px;
    font-weight: bold;
}

.logo img {
    width: 40px;
    margin-right: 10px;
}

nav ul {
    list-style: none;
    display: flex;
    padding: 0;
}

nav ul li {
    margin: 0 15px;
}

nav ul li a {
    text-decoration: none;
    color: #333;
    font-size: 18px;
}

/* Auth Buttons */
.auth-buttons {
    display: flex;
    gap: 10px;
}

.btn-light, .btn-dark {
    padding: 10px 15px;
    border-radius: 5px;
    text-decoration: none;
    font-size: 16px;
}

.btn-light {
    background: transparent;
    border: 1px solid #6c63ff;
    color: #6c63ff;
}

.btn-dark {
    background: #6c63ff;
    color: white;
    border: none;
}

/* Hero Section */
.hero {
    padding: 80px 20px;
    color: #333;
}

.hero h1 {
    font-size: 36px;
}

.hero p {
    font-size: 20px;
    color: #555;
}

.hero img {
    width: 60%;
    margin-top: 20px;
}

.btn-primary {
    display: inline-block;
    background: #6c63ff;
    color: white;
    padding: 12px 25px;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
    margin-top: 10px;
}

/* Footer */
footer {
    background: #f8f9fa;
    padding: 20px;
    margin-top: 40px;
}

.footer-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10%;
}

.footer-logo {
    display: flex;
    align-items: center;
    font-size: 20px;
    font-weight: bold;
}

.footer-logo img {
    width: 30px;
    margin-right: 10px;
}

.newsletter input {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.newsletter button {
    background: #6c63ff;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    margin-left: 5px;
}

.footer-nav {
    margin-top: 10px;
}

.footer-nav a {
    margin: 0 10px;
    color: #333;
    text-decoration: none;
    font-size: 16px;
}

    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="logo.png" alt="MindPal Logo">
            <span>MindPal</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">FAQs</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <a href="signup.html" class="btn-light">Sign Up</a>
            <a href="login.html" class="btn-dark">Login</a>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="hero">
        <h1>Welcome to MindPal</h1>
        <p>Your Trusted Companion</p>
        <a href="#" class="btn-primary">Get Started</a>
        <img src="hero-image.png" alt="Illustration">
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-logo">
                <img src="logo.png" alt="MindPal Logo">
                <span>MindPal</span>
            </div>
            <div class="newsletter">
                <input type="email" placeholder="Input your email">
                <button>Subscribe</button>
            </div>
        </div>
        <nav class="footer-nav">
            <a href="#">About Us</a>
            <a href="#">Contact Us</a>
            <a href="#">FAQs</a>
            <a href="#">Careers</a>
        </nav>
    </footer>

</body>
</html>
