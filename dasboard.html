<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindPal Dashboard</title>
    <style>

        /* Header */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 15px 10%;
    border-bottom: 1px solid #ddd;
}

.logo {
    display: flex;
    align-items: center;
    font-size: 22px;
    font-weight: bold;
}

.logo img {
    width: 40px;
    margin-right: 10px;
}

nav ul {
    list-style: none;
    display: flex;
    padding: 0;
}

nav ul li {
    margin: 0 15px;
}

nav ul li a {
    text-decoration: none;
    color: #333;
    font-size: 18px;
}

        /* Dashboard Styles */
.dashboard {
    text-align: center;
    padding: 40px 20px;
}

.dashboard h1 {
    font-size: 28px;
    color: #333;
}

.welcome {
    font-size: 22px;
    font-weight: bold;
}

.subtext {
    font-size: 16px;
    color: gray;
    font-style: italic;
    margin-bottom: 20px;
}

/* Quick Actions */
.quick-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-top: 20px;
}

.btn-action {
    display: block;
    width: 300px;
    background: #add8e6;
    color: black;
    padding: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    border-radius: 5px;
    text-decoration: none;
    transition: background 0.3s ease-in-out;
}

.btn-action:hover {
    background: #87ceeb;
}

/* Profile Icon */
.profile img {
    width: 40px;
    cursor: pointer;
    height: 40px;
    border-radius: 50%;
}

/* Active Link */
nav ul li a.active {
    font-weight: bold;
    text-decoration: underline;
}

    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="images/mindpal logo.png" alt="MindPal Logo">
            <span>MindPal</span>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">Dashboard</a></li>
                <li><a href="community.html">Community</a></li>
            </ul>
        </nav>
        <div class="profile">
            <a href="setting.html">
                <img src="images/icon pal.png" alt="User Profile">
            </a>
        </div>
    </header>

    <!-- Dashboard Content -->
    <main class="dashboard">
        <h1>Your MindPal Dashboard</h1>
        <p class="welcome">👋 Welcome, <span>[User's Name]</span>!</p>
        <p class="subtext">stay safe, stay anonymous</p>

        <div class="quick-actions">
            <a href="user-chat.html" class="btn-action">Start Chat</a>
            <a href="hotline.html" class="btn-action">Call Hotlines</a>
            <a href="community.html" class="btn-action">Community Support</a>
        </div>
    </main>

</body>
</html>
