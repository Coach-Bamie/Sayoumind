<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login</title>
   <style>
    /* Reset default styles */

    /* Header */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 15px 10%;
    border-bottom: 1px solid #ddd;
}

.logo {
    display: flex;
    align-items: center;
    font-size: 22px;
    font-weight: bold;
}

.logo img {
    width: 40px;
    margin-right: 10px;
}

nav ul {
    list-style: none;
    display: flex;
    padding: 0;
}

nav ul li {
    margin: 0 15px;
}

nav ul li a {
    text-decoration: none;
    color: #333;
    font-size: 18px;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f9f9f9;
    display: inline;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

/* Container */
.login-container {
    background-color: white;
    padding: 30px;
    margin: 70px auto;
    border-radius: 8px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    text-align: center;
    width: 350px;
}

/* Heading */
h2 {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* Paragraph */
p {
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
}

/* Input Fields */
input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
}

/* Login Button */
button {
    width: 100%;
    padding: 12px;
    background-color: #5A5AD1;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

button span {
    margin-right: 8px;
}

/* Forgot Password */
.forgot-password {
    display: block;
    margin-top: 15px;
    font-size: 14px;
    color: #666;
    text-decoration: none;
}

.forgot-password:hover {
    text-decoration: underline;
}

   </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="images/mindpal logo.png" alt="MindPal Logo">
            <span>MindPal</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Community</a></li>
                <li><a href="#">Resources</a></li>
            </ul>
        </nav>
    </header>

    <div class="login-container">
        <h2>Super Admin Login</h2>
        <p>Enter your credentials to access the admin panel.</p>
        <form>
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">
                <span>🔑</span> Log In
            </button>
        </form>
        <a href="#" class="forgot-password">Forgot your password?</a>
    </div>
</body>
</html>
